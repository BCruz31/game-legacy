html, body, #canvas {
	margin: 0;

	color: white;

	display: none;

	bottom: 10%;

<script>
(function(){
  // Landscape only, true fullscreen. Chrome only grants fullscreen on an activating gesture
  // (finger lift: pointerup / touchend / click, not touch-down), so ask on those, synchronously.
  function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
  function lock(){
    if(fsElement())return;
    var el=document.documentElement;
    var go=null;
    try{go=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null);}catch(e){}
    Promise.resolve(go).catch(function(){}).then(function(){
      try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}
    });
  }
  ['pointerup','touchend','click'].forEach(function(t){window.addEventListener(t,lock,{passive:true,capture:true});});
  window.addEventListener('DOMContentLoaded',function(){
    var d=document.createElement('div');d.id='rotate-note';d.textContent='';
    document.body.appendChild(d);
  });
})();
</script>
	
<script>
(() => {
  const running = "27a5247a4e909f09cbc7c37d231d0283d7796c16";
  let latest = '';
  let titleActive = false;
  let dialog = null;
  let requestSerial = 0;
  const removePrompt = () => {
    if (dialog) dialog.remove();
    dialog = null;
  };
  const showPrompt = () => {
    if (!titleActive || !latest || latest === running || dialog || !document.body) return;
    dialog = document.createElement('div');
    dialog.id = 'legacy-update-prompt';
    dialog.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px;box-sizing:border-box';
    const panel = document.createElement('div');
    panel.style.cssText = 'width:min(440px,95vw);border:2px solid #53caff;border-radius:14px;background:#091426;color:#e8f6ff;padding:22px;text-align:center;font:16px sans-serif;box-shadow:0 0 25px #145a9a';
    const heading = document.createElement('h2');
    heading.textContent = 'LEGACY UPDATE AVAILABLE';
    heading.style.cssText = 'margin:0 0 14px;font-size:21px';
    const message = document.createElement('p');
    message.textContent = 'A newer game build is ready. Update before entering Web World 01 so both players use the same version.';
    const button = document.createElement('button');
    button.textContent = 'UPDATE LEGACY';
    button.style.cssText = 'padding:13px 26px;margin-top:12px;background:#1666b8;color:white;border:1px solid #81dbff;border-radius:8px;font:bold 17px sans-serif;cursor:pointer';
    button.onclick = () => {
      button.disabled = true;
      button.textContent = 'LOADING UPDATE...';
      // Change the document URL without deleting account or game storage.
      location.replace(location.pathname + '?build=' + latest.slice(0,12) + '&reload=' + Date.now());
    };
    panel.append(heading,message,button);
    dialog.appendChild(panel);
    document.body.appendChild(dialog);
  };
  const check = async () => {
    const serial = ++requestSerial;
    try {
      const response = await fetch('legacy-version.json?check=' + Date.now(), {cache:'no-store'});
      if (!response.ok) return;
      const data = await response.json();
      if (serial !== requestSerial || !data.build || !/^[a-f0-9]{40}$/.test(data.build)) return;
      latest = data.build;
      if (latest === running) removePrompt();
      else showPrompt();
    } catch (_) {
      // A failed version check must not block game startup.
    }
  };
  window.LegacyVersionGate = {
    setTitleActive(active) {
      titleActive = !!active;
      if (titleActive) { showPrompt(); check(); }
      else removePrompt();
    }
  };
  document.addEventListener('visibilitychange', () => {if (!document.hidden) check();});
  setInterval(() => {if (!document.hidden) check();}, 60000);
  check();
})();
</script>
<script src="legacy_text_input.js"></script><script src="legacy_social_auth.js"></script><style>

</style><script>
document.addEventListener('DOMContentLoaded',function(){
  var splash=document.createElement('div');splash.id='legacy-web-loading';
  splash.innerHTML='<picture><source media="(orientation:landscape)" srcset="legacy-loading-landscape.png"><img src="legacy-loading-portrait.png" alt="Legacy Loading"></picture><div class="ok-mask"></div><div id="legacy-load-track"><div id="legacy-load-fill"></div></div><div id="legacy-load-label">LOADING 0%</div>';
  document.body.appendChild(splash);
  var fill=document.getElementById('legacy-load-fill'),label=document.getElementById('legacy-load-label');
  var source=document.getElementById('status-progress'),canvas=document.querySelector('canvas');
  var shown=0;
  function sync(){
    if(!source||!source.isConnected)source=document.getElementById('status-progress');
    // Browser bootstrap occupies the first 10%; Godot's actual loader
    // fills the remaining 90%. Progress never resets between phases.
    var browserPart=document.readyState==='loading'?0:10;
    var godotPart=0;
    if(source){
      var bar=source.firstElementChild||source;
      var style=bar.style.width||'';
      if(style.endsWith('%'))godotPart=parseFloat(style);
      else if(source.clientWidth>0)godotPart=100*bar.getBoundingClientRect().width/source.getBoundingClientRect().width;
    }
    if(!Number.isFinite(godotPart))godotPart=0;
    var pct=Math.max(0,Math.min(100,browserPart+0.9*Math.max(0,Math.min(100,godotPart))));
    shown=Math.max(shown,pct);
    fill.style.width=shown+'%';
    label.textContent='LOADING '+Math.round(shown)+'%';
  }
  // Observe Godot's own progress element, not our overlay: avoid mutation loops.
  var watch=new MutationObserver(function(){
    sync();
    var status=document.getElementById('status');
    var started=canvas&&canvas.width>0&&canvas.height>0&&
      getComputedStyle(canvas).display!=='none'&&
      (!status||getComputedStyle(status).display==='none');
    if(started){splash.remove();watch.disconnect();}
  });
  var status=document.getElementById('status');
  if(status)watch.observe(status,{attributes:true,childList:true,subtree:true,attributeFilter:['style','class']});
  if(source)watch.observe(source,{attributes:true,childList:true,subtree:true,attributeFilter:['style','class']});
  sync();
  // Godot can start without toggling #status; never leave the overlay blocking play.
  var poll=setInterval(function(){
    if(!splash.isConnected){clearInterval(poll);return;}
    sync();
    var status=document.getElementById('status');
    if(canvas&&canvas.width>0&&canvas.height>0&&getComputedStyle(canvas).display!=='none'&&
      (!status||getComputedStyle(status).display==='none')){
      splash.remove();watch.disconnect();clearInterval(poll);
    }
  },250);
  window.addEventListener('pagehide',function(){watch.disconnect();splash.remove()},{once:true});
});
</script></head>

			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":29377340,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				if (!sessionStorage.getItem('legacy_coi_reload_attempted')) {
              sessionStorage.setItem('legacy_coi_reload_attempted', '1');
              window.location.reload();
            } else {
              console.error('Legacy: cross-origin isolation unavailable after one retry');
              displayFailureNotice('Browser initialization failed. Please reopen Legacy in Safari or Chrome.');
            }
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

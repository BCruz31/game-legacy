<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Legacy</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="index.180x180.png">
<meta name="apple-mobile-web-app-title" content="Legacy">
<meta name="theme-color" content="#07111b">
<style>html,body{background:#000}</style>
	
<style>
  #status { visibility:hidden !important; pointer-events:none !important; }
  #legacy-loading-screen {position:fixed;inset:0;z-index:2147483600;overflow:hidden;
    background:#030613;pointer-events:auto;touch-action:none;}
  #legacy-loading-screen img {position:absolute;object-fit:contain;max-width:none;
    max-height:none;pointer-events:none;}
  #legacy-loader-bg {position:absolute;inset:-4.5%;width:109%;height:109%;
    background:url('legacy-loader-bg.png') center/cover no-repeat;}
  #legacy-loader-left {left:13%;top:12%;width:34%;height:79%;z-index:4;}
  #legacy-loader-right {left:53%;top:12%;width:34%;height:79%;z-index:5;}
  #legacy-loader-panel {left:34%;top:25%;width:32%;height:56%;z-index:10;}
  #legacy-loader-logo {left:26%;top:1.2%;width:48%;height:24.5%;z-index:20;}
  #legacy-loading-controls {position:absolute;left:41.5%;top:81%;width:17%;
    height:14%;z-index:14;display:flex;flex-direction:column;justify-content:center;
    box-sizing:border-box;text-align:center;background:rgba(1,6,27,.86);
    border:2px solid #16b8ff;border-radius:14px;box-shadow:0 0 17px #098cff;
    color:#e9fbff;font:700 clamp(9px,1.5vw,16px) system-ui,sans-serif;
    text-shadow:0 0 8px #0bc5ff;letter-spacing:1px;padding:7px;}
  #legacy-loading-track {margin-top:6px;height:8px;background:#101a36;
    border:1px solid #167bb4;border-radius:8px;overflow:hidden;}
  #legacy-loading-fill {height:100%;width:0;background:linear-gradient(90deg,#1171cb,#12e9ff);
    box-shadow:0 0 8px #18c8f9;transition:width 100ms linear;}
  #legacy-loading-screen.error #legacy-loading-controls {border-color:#ff4979;}
  @media (orientation:portrait) {
    #legacy-loader-left {left:1.5%;top:18%;width:56%;height:42%;}
    #legacy-loader-right {left:42.5%;top:18%;width:56%;height:42%;}
    #legacy-loader-logo {left:8%;top:2.8%;width:84%;height:21%;}
    #legacy-loader-panel {left:13%;top:46%;width:74%;height:35%;}
    #legacy-loading-controls {left:32%;top:82.5%;width:36%;height:9%;
      border-radius:11px;font-size:clamp(10px,2.5vw,16px);}
  }
</style>
<script>
(function(){
  function el(id){return document.getElementById(id);}
  document.addEventListener('DOMContentLoaded',function(){
    if(el('legacy-loading-screen'))return;
    const screen=document.createElement('div');screen.id='legacy-loading-screen';
    screen.innerHTML='<div id="legacy-loader-bg"></div>'+
      '<img id="legacy-loader-left" src="legacy-loader-left.png" alt="">'+
      '<img id="legacy-loader-right" src="legacy-loader-right.png" alt="">'+
      '<img id="legacy-loader-panel" src="legacy-loader-panel.png" alt="">'+
      '<img id="legacy-loader-logo" src="legacy-loader-logo.png" alt="">'+
      '<div id="legacy-loading-controls"><span id="legacy-loading-label">LOADING</span>'+
      '<div id="legacy-loading-track"><div id="legacy-loading-fill"></div></div></div>';
    document.body.appendChild(screen);
  });
  window.legacyWarningProgress=function(current,total){
    const fill=el('legacy-loading-fill'),label=el('legacy-loading-label');
    if(!fill||!label)return;
    if(total>0&&current>=0){
      const pct=Math.min(100,Math.max(0,Math.round(current/total*100)));
      fill.style.width=pct+'%';label.textContent='LOADING '+pct+'%';
    }else{label.textContent='LOADING';}
  };
  window.legacyWarningReady=function(){
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      const screen=el('legacy-loading-screen');if(screen)screen.remove();
    });});
  };
  window.legacyWarningFailure=function(err){
    const screen=el('legacy-loading-screen');
    if(screen)screen.classList.add('error');
    const label=el('legacy-loading-label');
    if(label)label.textContent='LOADING FAILED — RELOAD';
    console.error('Legacy failed to load',err);
  };
})();
</script>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21233556,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		window.legacyWarningFailure(err);
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				window.legacyWarningProgress(current,total);
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window.legacyWarningReady();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>

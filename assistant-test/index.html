		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
(function(){
  // Landscape only, true fullscreen. Chrome only grants fullscreen on an activating gesture
  // (finger lift: pointerup / touchend / click, not touch-down), so ask on those, synchronously.
  function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
  function lock(){
    if(fsElement())return;
    var el=document.documentElement;
    var go=null;
    try{go=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null);}catch(e){}
    Promise.resolve(go).catch(function(){}).then(function(){
      try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}
    });
  }
  ['pointerup','touchend','click'].forEach(function(t){window.addEventListener(t,lock,{passive:true,capture:true});});
  window.addEventListener('DOMContentLoaded',function(){
    var d=document.createElement('div');d.id='rotate-note';d.textContent='';
    document.body.appendChild(d);
  });
})();
</script>
	<script>
(function(){
  const key='legacy_startup_trace_v1', max=80;
  function read(){try{return JSON.parse(localStorage.getItem(key)||sessionStorage.getItem(key)||'[]')}catch(e){return []}}
  function mark(message){
    const rows=read(); rows.push({at:new Date().toISOString(),message:String(message)});
    try{const data=JSON.stringify(rows.slice(-max));localStorage.setItem(key,data);sessionStorage.setItem(key,data)}catch(e){}
    render();
  }
  function render(){
    const panel=document.getElementById('legacy-diagnostics');
    if(!panel)return;
    const rows=read(), last=rows.slice(-8);
    panel.textContent='LEGACY DIAGNOSTICS (tap to copy)\n'+last.map(x=>x.at.slice(11,19)+' '+x.message).join('\n');
  }
  window.LegacyStartupTrace={mark:mark,read:read};
  window.addEventListener('error',e=>mark('JS ERROR '+(e.message||'unknown')));
  window.addEventListener('unhandledrejection',e=>mark('PROMISE ERROR '+String(e.reason)));
  window.addEventListener('resize',()=>mark('VIEWPORT resize '+innerWidth+'x'+innerHeight));
  window.addEventListener('orientationchange',()=>mark('ORIENTATION change '+screen.orientation?.type));
  document.addEventListener('visibilitychange',()=>mark('PAGE visibility '+document.visibilityState));
  window.addEventListener('pageshow',e=>mark('PAGE SHOW persisted='+e.persisted));
  document.addEventListener('play',e=>mark('MEDIA play '+(e.target?.tagName||'unknown')),true);
  document.addEventListener('playing',e=>mark('MEDIA playing '+(e.target?.tagName||'unknown')),true);
  document.addEventListener('ended',e=>mark('MEDIA ended '+(e.target?.tagName||'unknown')),true);
  document.addEventListener('error',e=>{if(e.target?.tagName==='VIDEO')mark('MEDIA error video')},true);
  document.addEventListener('click',e=>{const t=e.target;if(t?.closest?.('#legacy-diagnostics'))return;mark('DOM click '+(t?.tagName||'unknown'))},true);
  window.addEventListener('beforeunload',()=>mark('PAGE beforeunload'));
  const originalError=console.error.bind(console);
  console.error=function(){const msg=Array.from(arguments).map(String).join(' ');mark('CONSOLE ERROR '+msg.slice(0,300));originalError.apply(console,arguments)};
  const originalLog=console.log.bind(console);
  console.log=function(){const msg=Array.from(arguments).map(String).join(' ');if(msg.includes('LEGACY STARTUP:'))mark('GODOT '+msg.slice(0,300));originalLog.apply(console,arguments)};
  window.addEventListener('DOMContentLoaded',()=>{
    const panel=document.createElement('pre');
    panel.id='legacy-diagnostics';
    panel.style.cssText='position:fixed;z-index:2147483647;top:4px;right:4px;max-width:42vw;max-height:13vh;overflow:auto;background:#000c;color:#9fe;padding:5px;font:10px monospace;white-space:pre-wrap;pointer-events:none;opacity:.72';
    panel.title='Tap to share diagnostics';
    // Keep diagnostics reachable even when Godot never reaches the title.
    panel.style.pointerEvents='auto';
    panel.style.visibility='visible';
    panel.style.display='block';
    // Warning bumper: visible read-only; unlock once the loader leaves.
    function panelAccess(){
      const bumper=document.getElementById('legacy-web-loading');
      // Only unlock after the actual Godot canvas is active.
      // The warning bumper may be a Godot scene, not the HTML splash.
      const canvas=document.querySelector('canvas');
      const status=document.getElementById('status');
      const active=!!canvas && canvas.width>0 && canvas.height>0 && getComputedStyle(canvas).display!=='none' && (!status || getComputedStyle(status).display==='none');
      const blocked=!!bumper && bumper.isConnected || !active;
      panel.style.pointerEvents=blocked?'none':'auto';
      panel.style.opacity=blocked?'.55':'.85';
    }
    new MutationObserver(panelAccess).observe(document.body,{childList:true,subtree:false});
    panelAccess();
    panel.style.cursor='pointer';
    panel.onclick=async()=>{
      const data=read().map(x=>x.at+' '+x.message).join('\n');
      try{
        if(navigator.share){await navigator.share({title:'Legacy diagnostics',text:data});return;}
      }catch(e){if(e.name==='AbortError')return;}
      try{if(navigator.clipboard){await navigator.clipboard.writeText(data);panel.title='Diagnostics copied';return;}}catch(e){}
      const box=document.createElement('textarea');box.value=data;box.style.cssText='position:fixed;top:15%;left:5%;width:90%;height:55%;z-index:2147483647';document.body.appendChild(box);box.focus();box.select();
    };
    document.body.appendChild(panel);render();panelAccess();
  });
  mark('PAGE INITIALIZED '+location.pathname);
  window.addEventListener('pagehide',()=>mark('PAGE HIDE'));
})();

</style><script>
document.addEventListener('DOMContentLoaded',function(){
  var splash=document.createElement('div');splash.id='legacy-web-loading';
  splash.innerHTML='<picture><source media="(orientation:landscape)" srcset="legacy-loading-landscape.png"><img src="legacy-loading-portrait.png" alt="Legacy Loading"></picture><div class="ok-mask"></div><div id="legacy-load-track"><div id="legacy-load-fill"></div></div><div id="legacy-load-label">LOADING 0%</div>';
  document.body.appendChild(splash);
  var fill=document.getElementById('legacy-load-fill'),label=document.getElementById('legacy-load-label');
  var source=document.getElementById('status-progress'),canvas=document.querySelector('canvas');
  var shown=0, lastReported=-1;
  function sync(){
    if(!source||!source.isConnected)source=document.getElementById('status-progress');
    // Browser bootstrap occupies the first 10%; Godot's actual loader
    // fills the remaining 90%. Progress never resets between phases.
    var browserPart=document.readyState==='loading'?0:10;
    var godotPart=0;
    if(source){
      var bar=source.firstElementChild||source;
      var style=bar.style.width||'';
      if(style.endsWith('%'))godotPart=parseFloat(style);
      else if(source.clientWidth>0)godotPart=100*bar.getBoundingClientRect().width/source.getBoundingClientRect().width;
    }
    if(!Number.isFinite(godotPart))godotPart=0;
    var pct=Math.max(0,Math.min(100,browserPart+0.9*Math.max(0,Math.min(100,godotPart))));
    shown=Math.max(shown,pct);
    fill.style.width=shown+'%';
    label.textContent='LOADING '+Math.round(shown)+'%';
    var step=Math.floor(shown/10)*10;
    if(step>lastReported){lastReported=step;if(window.LegacyStartupTrace)window.LegacyStartupTrace.mark('WEB LOADER '+step+'%');}
  }
  // Observe Godot's own progress element, not our overlay: avoid mutation loops.
  var watch=new MutationObserver(function(){
    sync();
    var status=document.getElementById('status');
    var started=canvas&&canvas.width>0&&canvas.height>0&&
      getComputedStyle(canvas).display!=='none'&&
      (!status||getComputedStyle(status).display==='none');
    if(started){if(window.LegacyStartupTrace)window.LegacyStartupTrace.mark('WEB LOADER removed; canvas active');splash.remove();watch.disconnect();}
  });
  var status=document.getElementById('status');
  if(status)watch.observe(status,{attributes:true,childList:true,subtree:true,attributeFilter:['style','class']});
  if(source)watch.observe(source,{attributes:true,childList:true,subtree:true,attributeFilter:['style','class']});
  sync();
  // Godot can start without toggling #status; never leave the overlay blocking play.
  var poll=setInterval(function(){
    if(!splash.isConnected){clearInterval(poll);return;}
    sync();
    var status=document.getElementById('status');
    if(canvas&&canvas.width>0&&canvas.height>0&&getComputedStyle(canvas).display!=='none'&&
      (!status||getComputedStyle(status).display==='none')){
      if(window.LegacyStartupTrace)window.LegacyStartupTrace.mark('WEB LOADER removed by poll');
      splash.remove();watch.disconnect();clearInterval(poll);
    }
  },250);
  window.addEventListener('pagehide',function(){if(window.LegacyStartupTrace)window.LegacyStartupTrace.mark('WEB LOADER pagehide');watch.disconnect();splash.remove()},{once:true});
});

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28184480,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

(function(){
  // Landscape only, true fullscreen. Chrome only grants fullscreen on an activating gesture
  // (finger lift: pointerup / touchend / click, not touch-down), so ask on those, synchronously.
  function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
  function lock(){
    if(fsElement())return;
    var el=document.documentElement;
    var go=null;
    try{go=el.requestFullscreen?el.requestFullscreen({navigationUI:'hide'}):(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null);}catch(e){}
    Promise.resolve(go).catch(function(){}).then(function(){
      try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}
    });
  }
  ['pointerup','touchend','click'].forEach(function(t){window.addEventListener(t,lock,{passive:true,capture:true});});
  window.addEventListener('DOMContentLoaded',function(){
    var d=document.createElement('div');d.id='rotate-note';d.textContent='';
    document.body.appendChild(d);
  });
})();

<script>
(() => {
  // The page's own build; the game pack reports its own (BuildStamp) through checkNow,
  // and that is what's compared: a pack served stale from a cache shows as out of date.
  const pageBuild = "e1decefbf0aa6e99efaf1024cf982d3aeb88a278";
  let running = pageBuild;
  let latest = '';
  let latestAt = '';
  let state = 'unknown';
  let dialog = null;
  let requestSerial = 0;
  let checking = null;
  const SCOPE = '/world-lab-preview/';
  const CACHE_PREFIX = 'Legacy-world-lab-preview-cache-';
  // Do not refresh the page during startup. Safari may serve an older
  // service-worker-controlled document after an update; an automatic
  // reload here can repeatedly restart Godot before it reaches title.
  // The version gate below offers an explicit update action instead.
  try {
    localStorage.setItem('legacy_page_build', pageBuild);
  } catch (_) {}
  // Diagnostics survive a full navigation, including unexpected browser
  // process restarts. No automatic navigation is performed here.
  try {
    const previous = JSON.parse(sessionStorage.getItem('legacy_startup_trace') || '{}');
    const now = Date.now();
    const count = previous.build === pageBuild && now - (previous.time || 0) < 120000
      ? (previous.count || 0) + 1 : 1;
    const trace = {build: pageBuild, time: now, count: count, phase: 'page-start'};
    sessionStorage.setItem('legacy_startup_trace', JSON.stringify(trace));
    window.LegacyStartupTrace = function(phase) {
      trace.phase = phase;
      trace.time = Date.now();
      sessionStorage.setItem('legacy_startup_trace', JSON.stringify(trace));
    };

      console.error('Legacy repeated startup', {count: count, previousPhase: previous.phase});
      // The lifecycle diagnostic renders this exact message in its
      // unified scrollable window; do not create a second red overlay.
      window.LegacyStartupRestartMessage = 'STARTUP RESTART #' + count + ' — PREVIOUS: ' + (previous.phase || 'unknown');

  // engine files between deployments. Do not reload to remove it.

    if (dialog) dialog.remove();

    if (isNaN(d)) return '';

  // the game's files are fetched fresh into the browser cache, then the page reloads.

    const say = (t) => { if (button) button.textContent = t; };

          if (key.startsWith(CACHE_PREFIX)) await caches.delete(key);

    // the restart finds it in the browser cache instead of downloading it a second time
    // (owner, Nov 5: the update downloaded the game, then the loading bar downloaded it again).
    // Download sequentially: the old Godot instance is still in memory,
    // so parallel WASM/PCK arrayBuffer allocations can terminate iOS WebKit.
    // Stream each response without retaining its full payload in JS memory.

            const part = await reader.read();
            if (part.done) break;

          }

          reader.releaseLock();

      // A deployment during an update must not mix two different versions.
      const manifestResponse = await fetch('legacy-version.json?verify=' + Date.now(), {cache:'no-store'});

      if (verified.build !== latest) throw new Error('Build changed while downloading; retry update');
    } catch (err) {
      console.error('Legacy update download failed:', err);
      say('DOWNLOAD FAILED — TAP TO RETRY');
      if (button) button.disabled = false;
      return;
    }
    say('RESTARTING...');
    window.LegacyLifecycleDiagnostics?.markNavigation('user-update');
    location.replace(location.pathname + '?v=' + latest.slice(0, 12));
  };
  const showPrompt = () => {
    if (!latest || latest === running || dialog || !document.body) return;
    dialog = document.createElement('div');
    dialog.id = 'legacy-update-prompt';
    dialog.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px;box-sizing:border-box';
    const panel = document.createElement('div');
    panel.style.cssText = 'width:min(440px,95vw);border:2px solid #53caff;border-radius:14px;background:#091426;color:#e8f6ff;padding:22px;text-align:center;font:16px sans-serif;box-shadow:0 0 25px #145a9a';
    const heading = document.createElement('h2');
    heading.textContent = 'LEGACY UPDATE AVAILABLE';
    heading.style.cssText = 'margin:0 0 14px;font-size:21px';
    const message = document.createElement('p');
    message.textContent = 'A newer build is out. Update to play with everyone on the same version.';
    const versions = document.createElement('p');
    versions.style.cssText = 'font:13px monospace;color:#9cc9e8;margin:10px 0 0';
    versions.textContent = 'NEW ' + latest.slice(0, 7) + (latestAt ? ' (' + when(latestAt) + ')' : '') + '  ·  YOURS ' + String(running).slice(0, 7);
    const button = document.createElement('button');
    button.textContent = 'UPDATE LEGACY';
    button.style.cssText = 'padding:13px 26px;margin-top:14px;background:#1666b8;color:white;border:1px solid #81dbff;border-radius:8px;font:bold 17px sans-serif;cursor:pointer';
    button.onclick = () => {
      if (button.disabled) return;
      button.disabled = true;
      update(button);
    };
    panel.append(heading, message, versions, button);
    dialog.appendChild(panel);
    document.body.appendChild(dialog);
  };
  const check = () => {
    const serial = ++requestSerial;
    checking = (async () => {
      try {
        const response = await fetch('legacy-version.json?check=' + Date.now(), {cache:'no-store'});
        if (!response.ok) throw new Error('manifest ' + response.status);
        const data = await response.json();
        if (serial !== requestSerial) return;
        if (!data.build || !/^[a-f0-9]{40}$/.test(data.build)) throw new Error('bad manifest');
        latest = data.build;
        latestAt = data.built_at || '';
        state = latest === running ? 'current' : 'update';
        if (state === 'current') removePrompt();
      } catch (_) {
        // No answer must never block the game.
        if (serial === requestSerial) state = 'unknown';
      }
    })();
    return checking;
  };
  window.LegacyVersionGate = {
    // The game asks with its own pack's build as the loading screen starts, and the
    // warning screen holds OK till status() is no longer 'checking' (owner, Nov 1).
    checkNow(packBuild) {
      if (packBuild && /^[a-f0-9]{40}$/.test(packBuild)) running = packBuild;
      state = 'checking';
      check();
      return true;
    },
    status() { return state; },
    running() { return running; },
    latest() { return latest; },
    updateReady() { return !!latest && latest !== running; },
    show() { showPrompt(); },
    update() { return update(null); },
    // Older packs called this; the prompt now only comes up when the game asks.
    setTitleActive(_) {}
  };
  // While playing, the check keeps running quietly; the next warning screen acts on it.
  document.addEventListener('visibilitychange', () => {if (!document.hidden && state !== 'checking') check();});
  setInterval(() => {if (!document.hidden && state !== 'checking') check();}, 120000);
})();
</script>

	const statusNotice = document.getElementById('status-notice');

		if (statusMode === mode || !initializing) {
			return;

			statusOverlay.remove();
			initializing = false;
			return;
		}

				// Reload if there was no error.
				console.error('Legacy preview: cross-origin isolation fallback was reached; refusing automatic page reload');
            window.LegacyLifecycleDiagnostics?.record('coi-fallback-blocked');
            displayFailureNotice('Browser initialization failed. Please reopen Legacy in Safari or Chrome.');
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		window.LegacyStartupTrace && window.LegacyStartupTrace('godot-start');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window.LegacyStartupTrace && window.LegacyStartupTrace('godot-ready');
		}, displayFailureNotice);
	}
}());
		</script>
